server:
  port: 8080

spring:
  config:
    import: optional:file:./config/secrets.yml
  servlet:
    multipart:
      max-file-size: 20MB
      # several sample statements can travel in one parser-generation request
      max-request-size: 100MB
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml
    liquibase-schema: public

fx:
  base-url: https://open.er-api.com

import:
  parser:
    python-command: python
    scripts-dir: parsers
    schedule-scripts-dir: parsers/schedules
    timeout: 120s
  generator:
    enabled: true
    timeout: 15m
    work-dir: .generator-tmp
    prompt-file: prompts/generate-parser.md
    claude:
      command: claude
      # blank = let the Claude Code CLI choose; aliases resolve to the current
      # version of that tier, so no edit is needed when a new one ships
      models: ["", "opus", "sonnet", "claude-fable-5"]
    codex:
      command: codex
      models: ["", "gpt-5.5-codex", "gpt-5.5"]
