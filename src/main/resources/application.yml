server:
  port: 8080

spring:
  config:
    import: optional:file:./config/secrets.yml
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml
    liquibase-schema: public

fx:
  base-url: https://open.er-api.com
