server:
  port: 8080

spring:
  config:
    import: optional:file:./config/secrets.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml
    liquibase-schema: public

fx:
  base-url: https://open.er-api.com

import:
  parser:
    python-command: python
    script-path: parse_statement.py
    timeout: 120s
